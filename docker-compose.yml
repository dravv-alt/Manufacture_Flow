services:
  db:
    image: postgres:16-alpine
    container_name: machine-overwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: machine_overwatch
      POSTGRES_USER: machine_overwatch
      POSTGRES_PASSWORD: machine_overwatch
    ports:
      - "5434:5432"
    volumes:
      - machine_overwatch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machine_overwatch -d machine_overwatch"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  machine_overwatch_postgres:
